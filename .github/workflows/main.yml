name: Build FIT BLOCK APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # Folder ka naam yahan direct likh diya, ab find ki zarurat nahi
    env:
      PROJECT_DIR: "Fit Block !"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: List files
        run: ls -la "${{ env.PROJECT_DIR }}"

      - name: Build Debug APK
        working-directory: "${{ env.PROJECT_DIR }}"
        run: gradle assembleDebug --stacktrace

      - name: Build Release AAB
        working-directory: "${{ env.PROJECT_DIR }}"
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitBlock-Debug-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FitBlock-Release-AAB
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab"
