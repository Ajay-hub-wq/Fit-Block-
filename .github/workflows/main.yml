name: Build FIT BLOCK APK/AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project root
        id: find
        run: |
          set +H
          ROOT=$(find . -name "settings.gradle.kts" -type f | head -n 1 | xargs dirname)
          if [ -z "$ROOT" ]; then ROOT="."; fi
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV
          echo "PROJECT at $ROOT"
          ls -la "$ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Build Debug APK (No gradlew needed)
        working-directory: "${{ env.PROJECT_DIR }}"
        run: |
          set +H
          gradle assembleDebug --stacktrace

      - name: Build Release AAB
        working-directory: "${{ env.PROJECT_DIR }}"
        run: |
          set +H
          gradle bundleRelease assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitBlock-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FitBlock-Release-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
